
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mewar-Sync | Heritage Artisan Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --saffron: #FF9933;
      --gold: #D4AF37;
      --marble: #F5F5F5;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--marble);
      color: #1a1a1a;
    }
    .font-heritage {
      font-family: 'Cinzel', serif;
    }
    .jharoka-frame {
      border-radius: 50% 50% 0 0 / 25% 25% 0 0;
      border: 4px solid var(--gold);
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .glass-mewar {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .bg-royal-gradient {
      background: linear-gradient(135deg, #FF9933 0%, #D4AF37 100%);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes scan-line {
      0% { top: 0; }
      100% { top: 100%; }
    }
    .animate-scan-line {
      animation: scan-line 2s linear infinite;
    }
    @keyframes waveform {
      0%, 100% { height: 4px; opacity: 0.5; }
      50% { height: 16px; opacity: 1; }
    }
    .animate-waveform {
      animation: waveform 1.2s ease-in-out infinite;
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
